name: Build Memcached for Windows

# Cross-compiles a native Windows memcached.exe with MinGW-w64 and self-tests
# it via wine, then publishes a GitHub Release so ServBay-PKG-Builder-v1 can
# fetch it.
#
# Runs directly on ubuntu-latest (fixed managed 24.04 image) — NOT in Docker —
# so we control the exact toolchain: ubuntu's mingw-w64 (gcc-13 / binutils 2.42)
# is new enough to link curl's prebuilt libressl (which needs the CFG runtime
# symbol __guard_dispatch_icall_fptr that debian:bookworm's older mingw lacks),
# and ubuntu's `wine` package works (debian:testing's wine packaging is broken).
# No Dockerfile / moving base-image dependency.
#
# Contract (same as the other ServBay/*-Windows-Portable repos):
#   tag:   memcached-<version>-win-<arch>   (e.g. memcached-1.6.44-win-x64)
#   asset: memcached-<version>-win64-mingw.zip

on:
  workflow_dispatch:
    inputs:
      memcached_version:
        description: 'memcached version (e.g. 1.6.44)'
        required: true
        default: '1.6.44'
      arch:
        description: 'Architecture'
        type: choice
        options: [x64, x86]
        default: x64
      skip_tests:
        description: 'Skip `make test` / mc-crusher (BUILD_ONLY=1).'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Configure version & arch
        id: cfg
        run: |
          set -euo pipefail
          VER='${{ inputs.memcached_version }}'
          ARCH='${{ inputs.arch }}'
          case "$ARCH" in
            x64) CPU=64; WINARCH=win64 ;;
            x86) CPU=32; WINARCH=win32 ;;
            *)  echo "::error::unknown arch $ARCH"; exit 1 ;;
          esac
          echo "cpu=$CPU"      >> "$GITHUB_OUTPUT"
          echo "winarch=$WINARCH" >> "$GITHUB_OUTPUT"
          sed -i "s/^export MEMCACHED_VER_=.*/export MEMCACHED_VER_='${VER}'/" mingw/build/_dl.sh
          echo "Patched _dl.sh ->"; grep '^export MEMCACHED_VER_' mingw/build/_dl.sh

      - name: Install build & test toolchain (MinGW + wine)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool \
            curl git gpg ca-certificates \
            python3 python3-pip \
            make cmake \
            gcc-mingw-w64 g++-mingw-w64 \
            zip unzip zstd file time jq dos2unix wget \
            wine64 perl netcat-traditional build-essential \
            netcat-openbsd libio-socket-ssl-perl libssl-dev
          # pefile is used by _peclean.py during the deterministic packaging step
          pip3 --disable-pip-version-check install --break-system-packages pefile

      - name: Build memcached (MinGW cross-compile + wine self-test)
        env:
          BUILD_ONLY: ${{ inputs.skip_tests && '1' || '' }}
          # CRUSHER_TEST gates run_crusher_test(): it launches the built
          # memcached.exe under wine and load-tests it with mc-crusher — the
          # real wine validation (memcached's own `make test` can't run a
          # cross-compiled .exe natively). Enabled unless skip_tests.
          CRUSHER_TEST: ${{ inputs.skip_tests && '' || '1' }}
        run: |
          set -euo pipefail
          cd mingw/build
          export PARALLEL=5
          export CPU='${{ steps.cfg.outputs.cpu }}'
          export CODECOV_DISABLE=1
          export BUILD_ONLY="${BUILD_ONLY}"
          export CRUSHER_TEST="${CRUSHER_TEST}"
          ./_build.sh
          # Surface the wine self-test log (run_crusher_test writes here). The
          # build is non-fatal on test failure, so print the log to diagnose.
          _crushlog="memcached/pkg/usr/local/tests/mc-crusher.log"
          if [ -f "${_crushlog}" ]; then
            echo "===== mc-crusher wine self-test log ====="
            tail -60 "${_crushlog}" || true
            echo "===== end mc-crusher log ====="
          fi

      - name: Collect artifact
        run: |
          set -euo pipefail
          VER='${{ inputs.memcached_version }}'
          WINARCH='${{ steps.cfg.outputs.winarch }}'
          ASSET="memcached-${VER}-${WINARCH}-mingw.zip"
          cd mingw/build
          if [ ! -f "${ASSET}" ]; then
            echo "::error::expected asset ${ASSET} not found in $(pwd)"
            ls -l ./*-*-mingw*.* 2>/dev/null || true
            echo "=== libevent config.log: SSL/link errors ==="
            grep -iE "SSL_new|undefined reference|cannot find|ld returned|conftest.*error" libevent/config.log 2>/dev/null | tail -30 || true
            exit 1
          fi
          mkdir -p ../../release-assets
          cp "${ASSET}" "../../release-assets/${ASSET}"
          (cd ../../release-assets && sha256sum "${ASSET}" > "${ASSET}.sha256")
          ls -la ../../release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: memcached-${{ inputs.memcached_version }}-win-${{ inputs.arch }}
          name: Memcached ${{ inputs.memcached_version }} for Windows (${{ inputs.arch }})
          files: |
            release-assets/memcached-${{ inputs.memcached_version }}-${{ steps.cfg.outputs.winarch }}-mingw.zip
            release-assets/*.sha256
          draft: false
          prerelease: false
